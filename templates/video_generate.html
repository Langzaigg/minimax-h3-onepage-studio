<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 视频生成</title>
  <style>
    :root{--ink:#162033;--muted:#667085;--line:#dce2ea;--brand:#3157d5;--brand2:#6e46d8;--bg:#f3f5f9;--card:#fff;--ok:#16845b;--bad:#c33b43}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 "Segoe UI","Microsoft YaHei",sans-serif}
    header{height:64px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid var(--line)}
    header h1{font-size:19px;margin:0} header a{color:var(--muted);text-decoration:none}.header-actions{display:flex;align-items:center;gap:12px}.auth-state{font-size:12px;color:var(--muted)}.layout{display:grid;grid-template-columns:minmax(430px,1.15fr) minmax(340px,.85fr);gap:18px;max-width:1380px;margin:auto;padding:20px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:10px}
    .panel{padding:22px}.panel h2{margin:0 0 4px;font-size:18px}.sub{color:var(--muted);margin:0 0 18px}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
    .mode{min-height:96px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:15px;text-align:left;cursor:pointer;color:var(--ink);transition:border-color .15s,background .15s}.mode::before{display:none}.mode strong{display:block;margin-bottom:7px;font-size:14px}.mode small{display:block;color:var(--muted);line-height:1.45}.mode:hover{border-color:#9aaeea;background:#fbfcff}.mode.active{border-color:var(--brand);background:#f7f8ff;box-shadow:inset 0 0 0 1px var(--brand)}.mode.active small{color:#5265a5}
    label{font-weight:600;display:block;margin:14px 0 7px}textarea,input,select{width:100%;border:1px solid #cfd6e1;border-radius:7px;background:#fff;color:var(--ink);padding:10px 11px;font:inherit}textarea{min-height:190px;resize:vertical}
    textarea:focus,input:focus,select:focus{outline:2px solid rgba(49,87,213,.16);border-color:var(--brand)}.prompt-head{display:flex;align-items:end;justify-content:space-between}.counter{color:var(--muted);font-size:12px}
    .frames{display:grid;grid-template-columns:1fr 1fr;gap:12px}.drop{position:relative;border:1px dashed #aeb8c8;border-radius:9px;min-height:150px;background:#fafbfc;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;color:var(--muted)}
    .drop input{position:absolute;inset:0;opacity:0;cursor:pointer}.drop img{width:100%;height:150px;object-fit:cover}.drop span{padding:16px}.hidden{display:none!important}.settings{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:10px;margin-top:18px}.warning{margin-top:12px;padding:10px 12px;border-radius:7px;color:#92520a;background:#fff7e8;border:1px solid #f2d49d;white-space:pre-line}.clear-frame{margin-top:5px;border:0;background:none;color:var(--muted);cursor:pointer}.reference-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.file-box{position:relative;min-height:158px;border:1px solid #d9e0ea;border-radius:12px;padding:15px;background:linear-gradient(145deg,#fbfcff,#f5f7fb);overflow:visible}.file-box::before{display:grid;width:31px;height:31px;place-items:center;margin-bottom:10px;border-radius:9px;color:#fff;background:#3157d5;font-size:16px;content:'▧'}.file-box:nth-child(2)::before{content:'▶';background:#6e46d8}.file-box:nth-child(3)::before{content:'♪';background:#16845b}.file-box label{margin:0 0 10px;font-size:13px}.file-box input[type=file]{height:36px;padding:0;border:0;background:transparent;color:transparent;cursor:pointer}.file-box input[type=file]::file-selector-button{margin-right:8px;padding:8px 11px;border:1px solid #cbd5e1;border-radius:7px;background:#fff;color:#3157d5;font:600 12px inherit;cursor:pointer}.file-box input[type=file]:hover::file-selector-button{border-color:#3157d5;background:#f3f6ff}.file-list{display:flex;flex-wrap:wrap;gap:5px;min-height:23px;margin-top:8px;font-size:11px;color:var(--muted);word-break:break-all}.file-chip{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:3px 7px;border-radius:5px;color:#475467;background:#e9edf5}.file-empty{padding:3px 0;color:#98a2b3}.inline-check{display:flex;align-items:center;gap:8px;margin-top:12px;font-weight:400}.inline-check input{width:auto}
    .reference-upload-row{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:12px;margin-bottom:12px}.mixed-reference-box{min-height:0;margin-bottom:0;background:#fff}.mixed-reference-box::before{display:none}.mixed-reference-box p{margin:0 0 10px;color:var(--muted);font-size:12px}.mixed-reference-input{position:relative;display:flex;align-items:center;justify-content:center;min-height:78px;border:1px dashed #b7c1d1;border-radius:8px;background:#fbfcfe;color:var(--muted);text-align:center;transition:border-color .15s,background .15s}.mixed-reference-input.dragging{border-color:var(--brand);background:#f4f6ff}.mixed-reference-input input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}.reference-drop-copy strong{display:block;color:var(--brand);font-size:13px}.reference-drop-copy span{display:block;margin-top:3px;font-size:12px}.reference-clear{display:block;margin:8px 0 0 auto;border:0;background:none;color:var(--muted);font-size:12px;cursor:pointer}.reference-clear:hover{color:var(--bad)}.reference-side-options{padding:14px;border:1px solid var(--line);border-radius:9px;background:#fff}.reference-side-options label:first-child{margin-top:0}.reference-side-options .inline-check{margin-top:18px}.reference-groups{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}.reference-group{flex:1 1 220px;min-width:0;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:#fff}.reference-group-title{display:flex;align-items:center;gap:7px;margin-bottom:7px;font-weight:700;font-size:12px}.reference-group-title b{display:none}.reference-group .file-list{margin-top:0}.reference-preview-list{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}.reference-preview{flex:0 0 128px;min-width:0;overflow:hidden;border:1px solid #e5e9f0;border-radius:6px;background:#f8fafc}.reference-preview img,.reference-preview video{display:block;width:100%;height:96px;object-fit:contain;background:#111827}.reference-preview audio{display:block;width:100%;height:42px}.reference-preview small{display:block;padding:5px 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:10px}
    button.primary,button.secondary{border:0;border-radius:8px;padding:11px 16px;font:600 14px inherit;cursor:pointer}.primary{color:#fff;background:linear-gradient(120deg,var(--brand),var(--brand2));flex:1}.secondary{color:var(--brand);background:#edf1ff}.actions button:disabled{opacity:.55;cursor:wait}
    .queue{display:flex;gap:8px;margin-bottom:12px}.pill{padding:5px 9px;border-radius:999px;background:#eef1f6;color:var(--muted);font-size:12px}.history{max-height:calc(100vh - 175px);overflow:auto;padding:0 16px 16px}.history-head{padding:20px 20px 10px;display:flex;justify-content:space-between;align-items:center}.history-head h2{margin:0;font-size:18px}
    .item{border:1px solid var(--line);border-radius:9px;padding:13px;margin-top:10px;cursor:pointer;transition:.15s}.item:hover{border-color:#a7b6e8;background:#fafbff}.item-top{display:flex;justify-content:space-between;gap:10px}.status{font-weight:650}.status.completed{color:var(--ok)}.status.failed{color:var(--bad)}.status.running,.status.queued{color:var(--brand)}
    .summary{color:#475467;margin:7px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.meta{color:var(--muted);font-size:12px}.bar{height:5px;background:#e7eaf0;border-radius:99px;overflow:hidden;margin-top:9px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),#8c63e8)}
    .empty{color:var(--muted);padding:36px 6px;text-align:center}.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);padding:10px 15px;border-radius:8px;background:#172033;color:#fff;box-shadow:0 8px 30px #0003;z-index:5}.toast.error{background:var(--bad)}.detail-actions{display:flex;gap:8px;margin:16px 0}.danger{border:0;border-radius:8px;padding:10px 14px;color:#a32831;background:#fff0f1;cursor:pointer}.video-result{position:relative;overflow:hidden;margin:-4px 0 18px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#f7f8fa}.video-result video{display:block;width:100%;max-height:520px;aspect-ratio:16/9;object-fit:contain;border-radius:7px;background:#111827}.video-result-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 2px 1px;color:var(--ink)}.video-result-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--muted)}.download-button{display:inline-flex;align-items:center;gap:7px;flex:none;padding:8px 12px;border-radius:7px;color:#fff;background:var(--brand);text-decoration:none;font-weight:650;transition:background .15s}.download-button:hover{background:#2546b7}.download-button::before{content:'↓';font-size:17px;line-height:12px}
    dialog{width:min(880px,calc(100% - 30px));max-height:90vh;border:0;border-radius:12px;padding:0;box-shadow:0 22px 70px #1b254055}dialog::backdrop{background:#18203399}.auth-dialog{width:min(480px,calc(100% - 30px))}.auth-form{padding:22px}.auth-form h2{margin:0 0 8px}.auth-form p{color:var(--muted)}.detail-head{padding:17px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.detail-body{padding:20px;overflow:auto;max-height:calc(90vh - 62px)}.detail-body video{width:100%;max-height:480px;background:#10131a;border-radius:8px}.detail-prompt{white-space:pre-wrap;background:#f7f8fa;border:1px solid var(--line);border-radius:8px;padding:13px}.thumbs,.reference-media{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.thumbs img,.reference-media img{width:100%;max-height:260px;object-fit:contain;background:#111;border-radius:7px}.reference-media article{border:1px solid var(--line);padding:8px;border-radius:8px}.reference-media video,.reference-media audio{width:100%}.reference-media small{display:block;color:var(--muted);margin-bottom:6px}.close{border:0;background:none;font-size:24px;cursor:pointer}
    @media(max-width:900px){.layout{grid-template-columns:1fr;padding:12px}.history{max-height:none}.settings{grid-template-columns:1fr 1fr}.reference-grid,.reference-groups,.reference-upload-row{grid-template-columns:1fr}.modes{grid-template-columns:1fr}header{padding:0 16px}}
    .reference-preview-caption{padding:5px 6px}.reference-preview-caption b{display:block;margin-bottom:2px;color:var(--brand);font-size:11px}.reference-preview-caption small{display:block;padding:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:10px}.file-chip b{margin-right:3px;color:var(--brand);font-weight:650}.reference-preview{position:relative}.reference-remove{position:absolute;top:4px;right:4px;width:22px;height:22px;padding:0;border:1px solid #ffffffaa;border-radius:50%;color:#fff;background:#172033bb;font:600 16px/19px sans-serif;cursor:pointer;z-index:1}.reference-remove:hover{background:var(--bad)}.panel-title{display:flex;align-items:center;justify-content:space-between;gap:10px}.history-toggle{display:none}.history-backdrop{display:none}.detail-progress{margin:-4px 0 18px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#f7f8fa}.detail-progress-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.detail-progress-head strong{font-size:14px}.detail-progress-head span{color:var(--muted);font-size:12px}.detail-progress-bar{height:7px;margin:10px 0 7px;border-radius:99px;background:#e4e8ef;overflow:hidden}.detail-progress-bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--brand),var(--brand2));transition:width .2s ease}.detail-progress p{margin:0;color:var(--muted);font-size:12px}
    @media(max-width:900px){.history-toggle{display:inline-flex;padding:8px 11px}.history-backdrop{position:fixed;inset:64px 0 0;background:#18203366;z-index:19}.history-backdrop.open{display:block}.history-panel{position:fixed;top:64px;right:0;bottom:0;width:min(380px,88vw);height:calc(100vh - 64px);z-index:20;border-radius:12px 0 0 12px;transform:translateX(105%);transition:transform .2s ease;box-shadow:-14px 0 32px #18203333;display:flex;flex-direction:column}.history-panel.history-open{transform:translateX(0)}.history-panel .history-head{flex:none}.history-panel .history{flex:1;max-height:none;overflow:auto}}
    @media(max-width:600px){header h1{font-size:16px}.header-actions{gap:6px}.auth-state{display:none}.header-actions #auth-button,.history-toggle{padding:7px 9px;font-size:12px}.header-actions a{font-size:12px;white-space:nowrap}}
  </style>
</head>
<body>
<header><h1>AI 视频生成</h1><div class="header-actions"><span class="auth-state" id="auth-state">未验证</span><button class="secondary" id="auth-button">输入访问密钥</button><a href="/admin-console">管理</a><a href="/docs">API 文档</a></div></header>
<main class="layout">
  <section class="card panel">
    <div class="panel-title"><h2>视频创作</h2><button class="secondary history-toggle" id="history-toggle" type="button" aria-controls="history-panel" aria-expanded="false">历史</button></div><p class="sub">任务 ID 仅保存在当前浏览器；返回页面后仍可查看进度与历史。</p>
    <div class="modes">
      <button class="mode active" data-mode="text_to_video"><strong>文本生成视频</strong><br><small>从场景描述构建完整视听时间线</small></button>
      <button class="mode" data-mode="reference_frames"><strong>参考帧生成视频</strong><br><small>可单独提供首帧、末帧，或同时提供两张</small></button>
      <button class="mode" data-mode="full_reference"><strong>多模态参考生成</strong><br><small>多图片、视频和音频共同参考</small></button>
    </div>
    <div id="full-reference-section" class="hidden">
      <div class="reference-upload-row"><div class="file-box mixed-reference-box"><label>参考素材（可混合上传）</label><p>一次选择图片、视频或音频，系统会自动识别并归类；图片最多 9 张，视频最多 3 个，音频最多 3 个。</p><div class="mixed-reference-input" id="reference-drop"><div class="reference-drop-copy"><strong>拖拽文件到这里</strong><span>或点击选择文件，也可直接粘贴</span></div><input id="reference-files" type="file" accept="image/*,video/*,audio/*" multiple></div><button class="reference-clear hidden" id="reference-clear" type="button">清空全部参考素材</button></div><div class="reference-side-options"><label for="ref-image-size">参考图片保真度</label><select id="ref-image-size"><option value="match" selected>match（推荐）</option><option value="max">max（高保真）</option></select><label class="inline-check"><input id="use-video-audio" type="checkbox" checked>同时使用参考视频自带音轨</label></div></div>
      <div class="reference-groups hidden" id="reference-groups">
        <div class="reference-group hidden" data-reference-kind="image"><div class="reference-group-title"><b>▧</b>参考图片</div><div class="file-list" id="reference-images-list"></div><div class="reference-preview-list" id="reference-images-preview"></div></div>
        <div class="reference-group hidden" data-reference-kind="video"><div class="reference-group-title"><b>▶</b>参考视频</div><div class="file-list" id="reference-videos-list"></div><div class="reference-preview-list" id="reference-videos-preview"></div></div>
        <div class="reference-group hidden" data-reference-kind="audio"><div class="reference-group-title"><b>♪</b>参考音频</div><div class="file-list" id="reference-audios-list"></div><div class="reference-preview-list" id="reference-audios-preview"></div></div>
      </div>
    </div>
    <div id="frame-section" class="hidden">
      <div class="frames">
        <div><label>首帧（可选）</label><div class="drop" id="first-drop"><span>点击、拖入或粘贴首帧图片</span><input id="first-frame" type="file" accept="image/*"></div><button class="clear-frame" id="clear-first" type="button">清除首帧</button></div>
        <div><label>末帧（可选）</label><div class="drop" id="last-drop"><span>点击、拖入或粘贴末帧图片</span><input id="last-frame" type="file" accept="image/*"></div><button class="clear-frame" id="clear-last" type="button">清除末帧</button></div>
      </div>
    </div>
    <div class="prompt-head"><label for="prompt">视频提示词</label><span class="counter" id="counter">0 字符</span></div>
    <textarea id="prompt" placeholder="例如：雨后的站台上，一位穿黄色雨衣的女子缓缓撑开红伞，远处列车驶近……"></textarea>
    <div class="settings">
      <div><label for="duration">时长（5～15 秒）</label><select id="duration"><option value="5">5 秒</option><option value="6">6 秒</option><option value="7">7 秒</option><option value="8">8 秒</option><option value="10">10 秒</option><option value="12">12 秒</option><option value="15">15 秒</option></select></div>
      <div><label for="megapixels">分辨率档位</label><select id="megapixels"><option value="0.2">0.2 MP（约 352p）</option><option value="0.3">0.3 MP（约 416p）</option><option value="0.4" selected>0.4 MP（约 480p，默认）</option><option value="0.5">0.5 MP（约 544p）</option><option value="0.6">0.6 MP</option><option value="0.7">0.7 MP</option><option value="0.8">0.8 MP</option><option value="0.9">0.9 MP</option><option value="1.0">1.0 MP（约 1K）</option></select></div>
      <div><label for="aspect">画面比例</label><select id="aspect"><option value="auto" selected>自动</option><option value="16:9">16:9（横屏）</option><option value="9:16">9:16（竖屏）</option><option value="1:1">1:1（方形）</option><option value="4:3">4:3</option><option value="3:4">3:4</option><option value="3:2">3:2</option><option value="2:3">2:3</option><option value="21:9">21:9（超宽）</option></select></div>
      <div><label for="seed">随机种子</label><input id="seed" type="number" min="0" placeholder="自动"></div>
    </div>
    <div id="warning" class="warning hidden"></div>
    <label class="inline-check"><input id="polish-before-generate" type="checkbox">生成前自动使用 AI 润色提示词</label>
    <div class="actions"><button class="secondary" id="polish">AI 一键润色</button><button class="primary" id="generate">开始生成</button></div>
  </section>
  <aside class="card history-panel" id="history-panel">
    <div class="history-head"><div><h2>生成历史</h2><div class="queue"><span class="pill" id="running">运行 0</span><span class="pill" id="pending">排队 0</span></div></div><button class="secondary" id="refresh">刷新</button></div>
    <div class="history" id="history"><div class="empty">还没有生成记录</div></div>
  </aside>
</main>
<div class="history-backdrop" id="history-backdrop"></div>
<dialog id="detail"><div class="detail-head"><strong>生成详情</strong><button class="close" id="close">×</button></div><div class="detail-body" id="detail-body"></div></dialog>
<dialog id="auth-dialog" class="auth-dialog"><form class="auth-form" id="auth-form"><h2 id="auth-dialog-title">访问验证</h2><p id="auth-dialog-desc">请输入管理员密钥或有效的 API Key。密钥会长期保存在当前浏览器中。</p><label for="access-secret" id="auth-dialog-label">管理员密钥 / API Key</label><input id="access-secret" type="password" autocomplete="off" required><div class="actions"><button class="secondary" id="auth-cancel" type="button">取消</button><button class="primary" id="auth-submit" type="submit">验证并记住</button></div></form></dialog>
<div id="toast" class="toast hidden"></div>
<script>
  const $=id=>document.getElementById(id); let mode='text_to_video',tasks=[],frameRatios={},ffmpegEnabled=false;
  const statusName={polishing:'润色中',preparing:'准备中',queued:'排队中',running:'生成中',completed:'已完成',failed:'失败'};
  const modeName={text_to_video:'文生视频',first_frame:'首帧生视频',last_frame:'尾帧生视频',first_last_frame:'首尾帧生视频',reference_to_video:'多模态参考生成'};
  const historyPanel=$('history-panel'),historyToggle=$('history-toggle'),historyBackdrop=$('history-backdrop');
  function setHistoryOpen(open){historyPanel.classList.toggle('history-open',open);historyBackdrop.classList.toggle('open',open);historyToggle.setAttribute('aria-expanded',String(open))}
  historyToggle.onclick=()=>setHistoryOpen(!historyPanel.classList.contains('history-open'));historyBackdrop.onclick=()=>setHistoryOpen(false);window.addEventListener('resize',()=>{if(window.innerWidth>900)setHistoryOpen(false)});
  document.querySelectorAll('.mode').forEach(btn=>btn.onclick=()=>{mode=btn.dataset.mode;document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('active',x===btn));$('frame-section').classList.toggle('hidden',mode!=='reference_frames');$('full-reference-section').classList.toggle('hidden',mode!=='full_reference');$('aspect').value='auto';updateWarnings()});
  $('prompt').oninput=()=> $('counter').textContent=`${$('prompt').value.length} 字符`;
  for(const [inputId,dropId,key] of [['first-frame','first-drop','first'],['last-frame','last-drop','last']]) $(inputId).onchange=e=>{const f=e.target.files[0];if(!f)return;const img=document.createElement('img');img.onload=()=>{frameRatios[key]=img.naturalWidth/img.naturalHeight;updateWarnings()};img.src=URL.createObjectURL(f);const d=$(dropId);d.querySelectorAll('img,span').forEach(x=>x.remove());d.prepend(img)};
  function clearFrame(key){const input=$(key+'-frame'),drop=$(key+'-drop');input.value='';delete frameRatios[key];drop.querySelectorAll('img,span').forEach(x=>x.remove());const span=document.createElement('span');span.textContent=`点击、拖入或粘贴${key==='first'?'首':'末'}帧图片`;drop.prepend(span);updateWarnings()}
  $('clear-first').onclick=()=>clearFrame('first');$('clear-last').onclick=()=>clearFrame('last');
  let referenceFileBuffer=[],referenceObjectUrls=[];
  function referenceKind(file){const mime=(file.type||'').toLowerCase(),ext=(file.name.split('.').pop()||'').toLowerCase();if(mime.startsWith('image/')||['png','jpg','jpeg','webp','bmp','tif','tiff'].includes(ext))return'image';if(mime.startsWith('video/')||['mp4','mov','webm','mkv','avi'].includes(ext))return'video';if(mime.startsWith('audio/')||['mp3','wav','m4a','aac','flac','ogg'].includes(ext))return'audio';return null}
  function groupedReferenceFiles(files){const groups={image:[],video:[],audio:[]};for(const file of files){const kind=referenceKind(file);if(!kind)throw Error(`无法识别参考素材类型：${file.name}`);groups[kind].push(file)}return groups}
  function referenceFileKey(file){return `${file.name}|${file.size}|${file.lastModified}`}
  function syncReferenceInput(){const transfer=new DataTransfer();referenceFileBuffer.forEach(file=>transfer.items.add(file));$('reference-files').files=transfer.files}
  function referenceType(kind){return kind==='image'?'Picture':kind==='video'?'Video':'Audio'}
  function referenceTag(kind,index,groups){const audioOffset=kind==='audio'&&$('use-video-audio').checked?groups.video.length:0;return `&lt;${referenceType(kind)} ${index+1+audioOffset}&gt;`}
  function removeReferenceFile(file){const key=referenceFileKey(file),index=referenceFileBuffer.findIndex(item=>referenceFileKey(item)===key);if(index<0)return;referenceFileBuffer.splice(index,1);syncReferenceInput();renderReferenceFiles(referenceFileBuffer);updateWarnings()}
  function renderReferenceFiles(files){const groups=groupedReferenceFiles(files),total=files.length;referenceObjectUrls.forEach(url=>URL.revokeObjectURL(url));referenceObjectUrls=[];$('reference-groups').classList.toggle('hidden',!total);$('reference-clear').classList.toggle('hidden',!total);for(const kind of ['image','video','audio']){const group=document.querySelector(`[data-reference-kind="${kind}"]`),prefix=kind==='image'?'reference-images':kind==='video'?'reference-videos':'reference-audios',list=$(`${prefix}-list`),preview=$(`${prefix}-preview`);group.classList.toggle('hidden',!groups[kind].length);list.innerHTML=groups[kind].map((x,index)=>`<span class="file-chip" title="${escapeHtml(x.name)}"><b>${referenceTag(kind,index,groups)}</b>${escapeHtml(x.name)}</span>`).join('');preview.innerHTML=groups[kind].map((file,index)=>{const url=URL.createObjectURL(file);referenceObjectUrls.push(url);const media=kind==='image'?`<img src="${url}" alt="${escapeHtml(file.name)}">`:kind==='video'?`<video controls muted preload="metadata" src="${url}"></video>`:`<audio controls preload="metadata" src="${url}"></audio>`;return `<div class="reference-preview"><button class="reference-remove" type="button" data-reference-index="${index}" aria-label="删除 ${referenceType(kind)} ${index+1}">×</button>${media}<div class="reference-preview-caption"><b>${referenceTag(kind,index,groups)}</b><small title="${escapeHtml(file.name)}">${escapeHtml(file.name)}</small></div></div>`}).join('');preview.querySelectorAll('.reference-remove').forEach(button=>button.onclick=()=>removeReferenceFile(groups[kind][Number(button.dataset.referenceIndex)]))}}
  function addReferenceFiles(files,replace=false){const incoming=[...files],next=replace?incoming:[...referenceFileBuffer,...incoming].filter((file,index,array)=>array.findIndex(item=>referenceFileKey(item)===referenceFileKey(file))===index),groups=groupedReferenceFiles(next);for(const [kind,max,label] of [['image',9,'参考图片'],['video',3,'参考视频'],['audio',3,'参考音频']])if(groups[kind].length>max)throw Error(`${label}最多上传 ${max} 个`);referenceFileBuffer=next;syncReferenceInput();renderReferenceFiles(next);updateWarnings()}
  $('reference-files').onchange=e=>{try{addReferenceFiles(e.target.files)}catch(error){syncReferenceInput();toast(error.message,true)}};
  $('reference-clear').onclick=()=>{referenceFileBuffer=[];syncReferenceInput();renderReferenceFiles([]);updateWarnings()};
  const referenceDrop=$('reference-drop');
  ['dragenter','dragover'].forEach(type=>referenceDrop.addEventListener(type,e=>{e.preventDefault();e.stopPropagation();referenceDrop.classList.add('dragging')}));
  ['dragleave','drop'].forEach(type=>referenceDrop.addEventListener(type,e=>{e.preventDefault();e.stopPropagation();referenceDrop.classList.remove('dragging')}));
  referenceDrop.addEventListener('drop',e=>{const files=[...e.dataTransfer.files];if(!files.length)return;try{addReferenceFiles(files)}catch(error){toast(error.message,true)}});
  function clipboardFiles(event){const data=event.clipboardData;if(!data)return[];const itemFiles=[...data.items].filter(item=>item.kind==='file').map(item=>item.getAsFile()).filter(Boolean);const files=itemFiles.length?itemFiles:[...data.files];const timestamp=Date.now();return files.map((file,index)=>{if(file.name&&file.name!=='blob')return file;const mime=(file.type||'application/octet-stream').toLowerCase();const extensions={'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif','video/mp4':'mp4','video/webm':'webm','video/quicktime':'mov','audio/mpeg':'mp3','audio/wav':'wav','audio/x-wav':'wav','audio/mp4':'m4a','audio/ogg':'ogg'};const extension=extensions[mime]||mime.split('/')[1]?.split('+')[0]||'bin';return new File([file],`pasted-${timestamp}-${index+1}.${extension}`,{type:mime,lastModified:timestamp+index})})}
  function handlePastedFiles(event){const files=clipboardFiles(event);if(!files.length)return;const target=event.target?.closest?.('#first-drop,#last-drop,#reference-drop');let destination=target?.id||'';if(!destination&&mode==='full_reference')destination='reference-drop';if(!destination&&mode==='reference_frames'){if(!$('first-frame').files.length)destination='first-drop';else if(!$('last-frame').files.length)destination='last-drop'}try{if(destination==='reference-drop'){event.preventDefault();addReferenceFiles(files);toast(`已粘贴 ${files.length} 个参考素材`);return}if(destination==='first-drop'||destination==='last-drop'){const image=files.find(file=>referenceKind(file)==='image');if(!image)throw Error('首帧和末帧只支持粘贴图片');event.preventDefault();setFiles($(destination==='first-drop'?'first-frame':'last-frame'),[image]);toast(`已粘贴${destination==='first-drop'?'首':'末'}帧`);return}if(mode==='reference_frames'&&files.length){throw Error('请先点击首帧或末帧区域，再粘贴图片')} }catch(error){event.preventDefault();toast(error.message,true)}}
  document.addEventListener('paste',handlePastedFiles);
  function updateWarnings(){const list=[];if(+$('duration').value>=8)list.push('时长达到 8 秒或以上，生成时间会很长。');if(+$('megapixels').value>0.5)list.push('分辨率高于 0.5 MP，生成时间会很长。');if(mode==='reference_frames'&&frameRatios.first&&frameRatios.last&&Math.abs(frameRatios.first-frameRatios.last)/Math.max(frameRatios.first,frameRatios.last)>.03)list.push('首帧与末帧画面比例不一致，将按所选画面比例居中裁剪。');if(mode==='full_reference'&&$('ref-image-size').value==='max')list.push('max 参考图保真度会让参考 token 参与每一步采样，生成时间会显著增加。');const box=$('warning');box.textContent=list.join('\n');box.classList.toggle('hidden',!list.length)}
  $('duration').onchange=updateWarnings;$('megapixels').onchange=updateWarnings;$('aspect').onchange=updateWarnings;
  $('ref-image-size').onchange=updateWarnings;
  $('use-video-audio').onchange=()=>{renderReferenceFiles(referenceFileBuffer);updateWarnings()};
  function toast(message,error=false){const t=$('toast');t.textContent=message;t.className=`toast${error?' error':''}`;setTimeout(()=>t.classList.add('hidden'),3500)}
  function formData(){const prompt=$('prompt').value.trim();if(!prompt)throw Error('请先填写视频提示词');const fd=new FormData();fd.append('prompt',prompt);fd.append('duration',$('duration').value);fd.append('resolution_megapixels',$('megapixels').value);fd.append('aspect_ratio',$('aspect').value);fd.append('polish_prompt_first',$('polish-before-generate').checked);if($('seed').value)fd.append('seed',$('seed').value);if(mode==='reference_frames'){const first=$('first-frame').files[0],last=$('last-frame').files[0];if(first)fd.append('first_frame',first);if(last)fd.append('last_frame',last);if(!first&&!last)throw Error('参考帧模式请至少提供首帧或末帧')}if(mode==='full_reference'){const groups=groupedReferenceFiles([...$('reference-files').files]),configs=[['image','reference_images',9,'参考图片'],['video','reference_videos',3,'参考视频'],['audio','reference_audios',3,'参考音频']];let count=0;for(const [kind,name,max,label] of configs){const files=groups[kind];if(files.length>max)throw Error(`${label}超过数量限制`);for(const file of files){fd.append(name,file);count++}}if(!count)throw Error('请至少选择一个参考图片、视频或音频');fd.append('use_video_audio',$('use-video-audio').checked);fd.append('ref_image_size',$('ref-image-size').value)}return fd}
  async function api(url,options){const r=await fetch(url,{cache:'no-store',...options});const body=await r.json().catch(()=>({}));if(!r.ok){if(r.status===401)showAuth();throw Error(body.detail||`请求失败（${r.status}）`)}return body}
  const accessStorageKey='minimax_h3_studio_access_secret';let accessInfo=null,accessMode='key';
  function showAuth(){const d=$('auth-dialog'),register=accessMode==='register';$('auth-dialog-title').textContent=register?'用户注册':'访问验证';$('auth-dialog-desc').textContent=register?'输入用户名即可注册并使用（无需密码），用户名会长期保存在当前浏览器中。':'请输入管理员密钥或有效的 API Key。密钥会长期保存在当前浏览器中。';$('auth-dialog-label').textContent=register?'用户名':'管理员密钥 / API Key';$('access-secret').type=register?'text':'password';$('access-secret').placeholder=register?'你的用户名':'管理员密钥 / API Key';$('access-secret').value=localStorage.getItem(accessStorageKey)||'';if(!d.open)d.showModal();setTimeout(()=>$('access-secret').focus(),50)}
  function updateAuth(info){accessInfo=info;$('auth-state').textContent=info?.authenticated?`${info.role==='admin'?'管理员':info.name} · 已验证`:'未验证';$('auth-button').textContent=info?.authenticated?(accessMode==='register'?'更换身份':'更换密钥'):(accessMode==='register'?'输入用户名':'输入访问密钥')}
  async function verifySecret(secret){const r=await fetch('/api/access/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({secret}),cache:'no-store'});const body=await r.json().catch(()=>({}));if(!r.ok)throw Error(body.detail||'访问验证失败');localStorage.setItem(accessStorageKey,secret);updateAuth(body);$('auth-dialog').close();return body}
  async function registerUser(username){const r=await fetch('/api/access/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username}),cache:'no-store'});const body=await r.json().catch(()=>({}));if(!r.ok)throw Error(body.detail||'注册失败');localStorage.setItem(accessStorageKey,username);updateAuth(body);$('auth-dialog').close();return body}
  $('auth-button').onclick=showAuth;$('auth-cancel').onclick=()=>$('auth-dialog').close();$('auth-form').onsubmit=async e=>{e.preventDefault();const button=$('auth-submit');try{button.disabled=true;if(accessMode==='register'){await registerUser($('access-secret').value.trim())}else{await verifySecret($('access-secret').value)}toast('访问验证成功');await load()}catch(error){toast(error.message,true)}finally{button.disabled=false}};
  $('polish').onclick=async()=>{const b=$('polish');try{const fd=formData();fd.delete('resolution_megapixels');fd.delete('aspect_ratio');fd.delete('seed');fd.delete('ref_image_size');b.disabled=true;b.textContent='正在分析参考素材并润色…';const url=mode==='full_reference'?'/api/video/reference-prompt-polish':'/api/video/prompt-polish';const res=await api(url,{method:'POST',body:fd});$('prompt').value=res.prompt;$('prompt').oninput();toast(`已使用 ${res.model||'视觉模型'} 完成润色`)}catch(e){toast(e.message,true)}finally{b.disabled=false;b.textContent='AI 一键润色'}};
  const taskStorageKey='minimax_h3_studio_task_ids';
  function localTaskIds(){try{return [...new Set(JSON.parse(localStorage.getItem(taskStorageKey)||'[]'))].filter(x=>/^[a-f0-9]{32}$/.test(x)).slice(0,500)}catch(_){return[]}}
  function rememberTask(id){localStorage.setItem(taskStorageKey,JSON.stringify([id,...localTaskIds().filter(x=>x!==id)].slice(0,500)))}
  function forgetTask(id){localStorage.setItem(taskStorageKey,JSON.stringify(localTaskIds().filter(x=>x!==id)))}
  $('generate').onclick=async()=>{const b=$('generate');try{b.disabled=true;b.textContent='正在创建…';const url=mode==='full_reference'?'/api/video/reference-tasks':'/api/video/tasks';const task=await api(url,{method:'POST',body:formData()});rememberTask(task.id);toast('生成任务已加入右侧历史列表，任务 ID 已保存在本浏览器');await load()}catch(e){toast(e.message,true)}finally{b.disabled=false;b.textContent='开始生成'}};
  function escapeHtml(s=''){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
  function render(){const root=$('history');if(!tasks.length){root.innerHTML='<div class="empty">还没有生成记录</div>';return}root.innerHTML=tasks.map(t=>`<article class="item" data-id="${t.id}"><div class="item-top"><span class="status ${t.status}">${statusName[t.status]||t.status}</span><span class="meta">${modeName[t.mode]||t.mode} · ${t.duration}s</span></div><div class="summary">${escapeHtml(t.prompt)}</div><div class="meta">${escapeHtml(t.current_stage||'')} ${t.queue_position?`· 前方 ${t.queue_position-1} 项`:''}</div><div class="bar"><i style="width:${t.progress||0}%"></i></div></article>`).join('');root.querySelectorAll('.item').forEach(x=>x.onclick=()=>{setHistoryOpen(false);openDetail(x.dataset.id)})}
  async function load(){try{const admin=accessInfo?.role==='admin';const ids=admin?'':localTaskIds().join(',');const query=`?task_ids=${encodeURIComponent(ids)}`;const [history,queue]=await Promise.all([api('/api/video/tasks'+query),api('/api/video/queue'+query)]);tasks=history.tasks;render();$('running').textContent=`运行 ${queue.running}`;$('pending').textContent=`排队 ${queue.pending}`}catch(e){toast(e.message,true)}}
  async function fileFromAsset(url,name){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error(`读取历史素材失败（${r.status}）`);const blob=await r.blob();return new File([blob],name,{type:blob.type})}
  function setFiles(input,files){const transfer=new DataTransfer();files.forEach(file=>transfer.items.add(file));input.files=transfer.files;input.dispatchEvent(new Event('change',{bubbles:true}))}
  async function restoreTask(t){try{const modeButton=t.mode==='reference_to_video'?'full_reference':t.mode==='text_to_video'?'text_to_video':'reference_frames';document.querySelector(`.mode[data-mode="${modeButton}"]`).click();$('prompt').value=t.original_prompt||t.prompt;$('prompt').oninput();$('duration').value=String(+t.duration);$('megapixels').value=String(+t.resolution_megapixels);$('aspect').value=new Set(['auto','16:9','9:16','1:1','4:3','3:4','3:2','2:3','21:9']).has(t.aspect_ratio)?t.aspect_ratio:'auto';$('seed').value=t.seed;$('polish-before-generate').checked=!!t.polished_prompt;if(t.mode==='reference_to_video'){$('ref-image-size').value=t.ref_image_size||'match';$('use-video-audio').checked=t.use_video_audio!==false;const files=await Promise.all((t.references||[]).map(r=>fileFromAsset(r.url,r.filename)));addReferenceFiles(files,true)}else{for(const [key,id] of [['first_frame','first-frame'],['last_frame','last-frame']]){if(t.assets[key])setFiles($(id),[await fileFromAsset(t.assets[key],`${key}.png`)]);else clearFrame(key==='first_frame'?'first':'last')}}updateWarnings();$('detail').close();window.scrollTo({top:0,behavior:'smooth'});toast('已把历史输入参数和素材回填到创作区')}catch(e){toast(e.message,true)}}
  async function deleteTask(t){if(!confirm('确定删除这条记录及全部输入、输出文件吗？删除后不可恢复。'))return;try{await api(`/api/video/tasks/${t.id}`,{method:'DELETE'});forgetTask(t.id);$('detail').close();await load();toast('记录及本地文件已删除')}catch(e){toast(e.message,true)}}
  async function openDetail(id){try{const t=await api(`/api/video/tasks/${id}`);const frames=['first_frame','last_frame'].filter(k=>t.assets[k]).map(k=>`<img src="${t.assets[k]}?v=${encodeURIComponent(t.updated_at)}" alt="${k}">`).join('');const refs=(t.references||[]).map(r=>{const type=r.kind==='image'?'Picture':r.kind==='video'?'Video':'Audio';const labelIndex=r.label_index||r.index;const paired=r.audio_label_index?` / &lt;Audio ${r.audio_label_index}&gt;`:'';const label=`&lt;${type} ${labelIndex}&gt;${paired} · ${escapeHtml(r.filename)}`;const media=r.kind==='image'?`<img src="${r.url}" alt="${label}">`:r.kind==='video'?`<video controls preload="metadata" src="${r.url}"></video>`:`<audio controls preload="metadata" src="${r.url}"></audio>`;return `<article><small>${label}</small>${media}</article>`}).join('');const warnings=(t.warnings||[]).map(escapeHtml).join('<br>');const prompts=t.polished_prompt?`<h3>原始提示词</h3><div class="detail-prompt">${escapeHtml(t.original_prompt||'')}</div><h3>润色后提示词</h3>`:'<h3>提示词</h3>';const videoName=escapeHtml(t.video_filename||`AI_Video_${t.id.slice(0,8)}.mp4`);const gifName=videoName.replace(/\.(mp4|webm|mov|mkv)$/i,'.gif');const progressValue=Math.min(100,Math.max(0,Number(t.progress)||0));const videoResult=t.status==='completed'&&t.assets.video?`<section class="video-result"><video controls preload="metadata" playsinline src="${t.assets.video}?v=${encodeURIComponent(t.updated_at)}"></video><div class="video-result-bar"><span class="video-result-name" title="${videoName}">${videoName}</span><span style="display:flex;gap:8px;flex:none"><a class="download-button" href="${t.assets.video}" download="${videoName}">下载视频</a>${ffmpegEnabled?`<a class="download-button" href="/api/video/tasks/${t.id}/gif" download="${gifName}">下载 GIF</a>`:''}</span></div></section>`:`<section class="detail-progress"><div class="detail-progress-head"><strong>${statusName[t.status]||t.status}</strong><span>${progressValue}%</span></div><div class="detail-progress-bar"><i style="width:${progressValue}%"></i></div><p>${escapeHtml(t.current_stage||'等待处理')}</p></section>`;$('detail-body').innerHTML=`${videoResult}${frames?`<div class="thumbs">${frames}</div>`:''}${refs?`<h3>参考素材</h3><div class="reference-media">${refs}</div>`:''}${warnings?`<div class="warning">${warnings}</div>`:''}${t.error?`<p style="color:var(--bad)">${escapeHtml(t.error)}</p>`:''}${prompts}<div class="detail-prompt">${escapeHtml(t.prompt)}</div><p class="meta">${t.width} × ${t.height} · ${t.resolution_megapixels} MP · ${t.aspect_ratio} · ${t.duration}s · seed ${t.seed}<br>${escapeHtml(t.created_at)}</p><div class="detail-actions"><button class="secondary" id="restore-task">回填输入参数</button>${['completed','failed'].includes(t.status)?'<button class="danger" id="delete-task">删除记录</button>':''}</div>`;$('restore-task').onclick=()=>restoreTask(t);const del=$('delete-task');if(del)del.onclick=()=>deleteTask(t);$('detail').showModal()}catch(e){toast(e.message,true)}}
  $('close').onclick=()=>$('detail').close();$('detail').onclick=e=>{if(e.target===$('detail'))$('detail').close()};$('refresh').onclick=load;
  async function loadConfig(){try{const c=await api('/api/config');ffmpegEnabled=!!c.ffmpeg_enabled;accessMode=c.access_mode||'key';const d=c.video_generation_defaults||{};if(d.duration)$('duration').value=String(+d.duration);if(d.resolution_megapixels)$('megapixels').value=String(+d.resolution_megapixels);updateWarnings()}catch(_){}}
  async function initialize(){await loadConfig();const secret=localStorage.getItem(accessStorageKey);if(secret){try{if(accessMode==='register'){await registerUser(secret)}else{await verifySecret(secret)}await load()}catch(_){localStorage.removeItem(accessStorageKey);updateAuth(null);showAuth()}}else showAuth()}
  initialize();setInterval(()=>{if(!document.hidden&&accessInfo)load()},3000);
</script>
