<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>管理 · 兔酱拍片工作室</title>
  <link rel="icon" href="/static/img/tujang-studio.svg" type="image/svg+xml">
  <style>
    :root{--ink:#182230;--muted:#667085;--line:#dbe1ea;--brand:#3157d5;--bad:#bd313c;--bg:#f3f5f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 "Segoe UI","Microsoft YaHei",sans-serif}header{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px}header h1{font-size:19px;margin:0}header a{color:var(--muted);text-decoration:none}main{max-width:1240px;margin:auto;padding:24px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:18px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.head h2{margin:0}.sub{color:var(--muted)}.form-grid,.filters{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;align-items:end;margin:18px 0}label{display:block;font-weight:600;margin-bottom:6px}input,select{width:100%;padding:10px;border:1px solid #cdd5df;border-radius:7px;font:inherit}button{border:0;border-radius:7px;padding:10px 14px;font-weight:600;cursor:pointer}.primary{background:var(--brand);color:#fff}.secondary{background:#edf1ff;color:var(--brand)}.danger{background:#fff0f1;color:var(--bad)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #edf0f4;vertical-align:top}th{color:var(--muted);font-size:12px}.key{font:12px Consolas,monospace;word-break:break-all;max-width:410px}.badge{display:inline-block;padding:3px 7px;border-radius:99px;background:#eaf8f1;color:#137452}.badge.off{background:#f5f0f0;color:#a0343d}.chart-wrap{height:390px;border:1px solid var(--line);border-radius:8px;padding:12px;margin:16px 0}canvas{width:100%;height:100%}.empty{text-align:center;color:var(--muted);padding:30px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#172033;color:#fff;padding:10px 15px;border-radius:8px}.hidden{display:none!important}@media(max-width:800px){.form-grid,.filters{grid-template-columns:1fr}.table-wrap{overflow:auto}main{padding:12px}}
  </style>
</head>
<body>
<header><h1>管理员控制台</h1><a href="/video-generate">← 兔酱拍片工作室</a></header>
<main>
  <section class="card" id="keys"><div class="head"><div><h2>API Key 管理</h2><div class="sub">完整密钥保存在本机；管理员可持续查看和复制。</div></div><button class="secondary" id="refresh-keys">刷新</button></div>
    <form class="form-grid" id="create-form"><div><label>Key 名称</label><input id="key-name" maxlength="80" placeholder="例如：视频制作组" required></div><div><label>生效时长</label><input id="key-duration" type="number" min="1" value="30" required></div><div><label>单位</label><select id="duration-unit"><option value="24">天</option><option value="1">小时</option><option value="720">月（30天）</option></select></div><button class="primary" type="submit">创建 Key</button></form>
    <div class="table-wrap"><table><thead><tr><th>名称 / 状态</th><th>完整 API Key</th><th>创建与过期时间</th><th>最近使用</th><th>操作</th></tr></thead><tbody id="key-rows"></tbody></table></div>
  </section>
  <section class="card" id="stats"><div class="head"><div><h2>API 每周调用统计</h2><div class="sub">仅记录实际业务 API 的成功调用，按自然日写入 JSON，按 ISO 周汇总展示。</div></div></div>
    <div class="filters"><div><label>开始日期</label><input id="start-date" type="date"></div><div><label>结束日期</label><input id="end-date" type="date"></div><div><label>按 Key 筛选</label><select id="key-filter"><option value="">全部 Key</option></select></div><button class="primary" id="load-stats">查询</button></div>
    <div class="chart-wrap"><canvas id="chart"></canvas></div>
    <div class="table-wrap"><table><thead><tr><th>周</th><th>API</th><th>Key</th><th>调用次数</th></tr></thead><tbody id="stat-rows"></tbody></table></div>
  </section>
</main><div class="toast hidden" id="toast"></div>
<script>
const $=id=>document.getElementById(id),secretKey='minimax_h3_studio_access_secret';let keys=[];
function toast(message){$('toast').textContent=message;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),3000)}
async function api(url,options={}){const headers={...(options.headers||{})};const secret=localStorage.getItem(secretKey);if(secret)headers['X-Admin-Key']=secret;const response=await fetch(url,{cache:'no-store',...options,headers});const body=await response.json().catch(()=>({}));if(!response.ok){if(response.status===401)location.href='/video-generate';throw Error(body.detail||`请求失败（${response.status}）`)}return body}
function esc(value=''){return String(value).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function formatTime(value){return value?new Date(value).toLocaleString():'—'}
async function loadKeys(){keys=await api('/api/admin/api-keys');$('key-rows').innerHTML=keys.length?keys.map(k=>`<tr><td><strong>${esc(k.name)}</strong><br><span class="badge ${k.active?'':'off'}">${k.active?'有效':'已失效'}</span></td><td class="key">${esc(k.api_key)}<br><button class="secondary copy" data-key="${esc(k.api_key)}">复制</button></td><td>${formatTime(k.created_at)}<br>至 ${formatTime(k.expires_at)}</td><td>${formatTime(k.last_used_at)}</td><td>${k.active?`<button class="danger revoke" data-id="${k.id}">撤销</button>`:'—'}</td></tr>`).join(''):'<tr><td colspan="5" class="empty">尚未创建 API Key</td></tr>';$('key-filter').innerHTML='<option value="">全部 Key</option><option value="anonymous">未认证</option><option value="admin">管理员</option>'+keys.map(k=>`<option value="${k.id}">${esc(k.name)}</option>`).join('');document.querySelectorAll('.copy').forEach(b=>b.onclick=async()=>{await navigator.clipboard.writeText(b.dataset.key);toast('完整 Key 已复制')});document.querySelectorAll('.revoke').forEach(b=>b.onclick=async()=>{if(!confirm('撤销后使用此 Key 的客户端将立即失去访问权限，确定继续吗？'))return;await api(`/api/admin/api-keys/${b.dataset.id}`,{method:'DELETE'});await loadKeys();await loadStats()})}
$('create-form').onsubmit=async e=>{e.preventDefault();const hours=Number($('key-duration').value)*Number($('duration-unit').value);try{const row=await api('/api/admin/api-keys',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('key-name').value,valid_for_hours:hours})});$('key-name').value='';await loadKeys();toast(`已创建 ${row.name}`)}catch(error){toast(error.message)}};$('refresh-keys').onclick=loadKeys;
function resizeCanvas(canvas){const ratio=devicePixelRatio||1,rect=canvas.getBoundingClientRect();canvas.width=rect.width*ratio;canvas.height=rect.height*ratio;const ctx=canvas.getContext('2d');ctx.setTransform(ratio,0,0,ratio,0,0);return {ctx,width:rect.width,height:rect.height}}
function drawChart(data){const {ctx,width,height}=resizeCanvas($('chart'));ctx.clearRect(0,0,width,height);const weeks=data.weeks, endpoints=data.endpoints;if(!weeks.length||!data.rows.length){ctx.fillStyle='#667085';ctx.textAlign='center';ctx.fillText('当前筛选范围没有调用数据',width/2,height/2);return}const palette=['#3157d5','#7a4dd8','#14a07a','#dc7d24','#d14355','#3b82a0','#8a7045'];const margin={l:52,r:18,t:24,b:64};const cw=width-margin.l-margin.r,ch=height-margin.t-margin.b;const totals={};data.rows.forEach(r=>{const key=`${r.week}|${r.endpoint}`;totals[key]=(totals[key]||0)+r.count});const max=Math.max(1,...Object.values(totals));ctx.strokeStyle='#dbe1ea';ctx.fillStyle='#667085';ctx.font='11px Segoe UI';ctx.textAlign='right';for(let i=0;i<=4;i++){const y=margin.t+ch*i/4;ctx.beginPath();ctx.moveTo(margin.l,y);ctx.lineTo(width-margin.r,y);ctx.stroke();ctx.fillText(Math.round(max*(4-i)/4),margin.l-8,y+4)}const group=cw/weeks.length,bar=Math.max(3,Math.min(18,(group-10)/Math.max(1,endpoints.length)));weeks.forEach((week,wi)=>{endpoints.forEach((endpoint,ei)=>{const value=totals[`${week}|${endpoint}`]||0,x=margin.l+wi*group+(group-endpoints.length*bar)/2+ei*bar,y=margin.t+ch-value/max*ch;ctx.fillStyle=palette[ei%palette.length];ctx.fillRect(x,y,Math.max(2,bar-2),margin.t+ch-y)});ctx.save();ctx.translate(margin.l+wi*group+group/2,height-44);ctx.rotate(-.45);ctx.fillStyle='#475467';ctx.textAlign='right';ctx.fillText(week,0,0);ctx.restore()});let lx=margin.l;endpoints.forEach((endpoint,i)=>{ctx.fillStyle=palette[i%palette.length];ctx.fillRect(lx,5,9,9);ctx.fillStyle='#475467';ctx.textAlign='left';const label=endpoint.length>28?endpoint.slice(0,27)+'…':endpoint;ctx.fillText(label,lx+13,13);lx+=ctx.measureText(label).width+32})}
async function loadStats(){try{const query=new URLSearchParams({start_date:$('start-date').value,end_date:$('end-date').value});if($('key-filter').value)query.set('key_id',$('key-filter').value);const data=await api('/api/admin/stats?'+query);$('stat-rows').innerHTML=data.rows.length?data.rows.map(r=>`<tr><td>${esc(r.week)}</td><td>${esc(r.endpoint)}</td><td>${esc(r.key_name)}</td><td>${r.count}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">没有统计数据</td></tr>';drawChart(data)}catch(error){toast(error.message)}}$('load-stats').onclick=loadStats;window.onresize=()=>loadStats();
const today=new Date(),start=new Date(today);start.setDate(start.getDate()-84);$('end-date').value=today.toISOString().slice(0,10);$('start-date').value=start.toISOString().slice(0,10);(async()=>{try{await loadKeys();await loadStats();if(location.hash==='#stats')$('stats').scrollIntoView()}catch(error){toast(error.message)}})();
</script></body></html>
