server:
  host: 0.0.0.0
  port: 7788
  admin_key: "admin"
  session_max_age_seconds: 31536000
  restart_delay_seconds: 1.5
  git_pull_timeout_seconds: 120

comfyui:
  base_url: "http://127.0.0.1:8188"
  timeout_seconds: 60
  models:
    # Official ComfyUI MiniMax H3 workflow defaults.
    fl2va_diffusion: "minimax_h3_fl2va_pruned_int8_convrot.safetensors"
    ref2va_diffusion: "minimax_h3_ref2va_pruned_int8_convrot.safetensors"
    text_encoder: "qwen3vl_32b_minimax_h3_int8_convrot.safetensors"
    video_vae: "minimax_h3_video_vae_fp16.safetensors"
    audio_vae: "minimax_h3_audio_vae_fp32.safetensors"
  # 采样加速（Spectrum Apply MiniMax H3），默认不启用：工作流完全移除该节点，
  # ComfyUI 侧无需安装 ComfyUI-Spectrum-MiniMax-H3 依赖；启用后才串联加速节点。
  # 本机如需启用，在 config.local.yml 中覆盖为 true。
  spectrum_apply:
    enabled: false

llm:
  base_url: "https://opencode.ai/zen/go/v1"
  # 私密项：本机 API Key 请写在 config.local.yml 的 llm.api_key（该文件已被 .gitignore 忽略）
  api_key: ""
  model: "minimax-m3"
  timeout_seconds: 180
  context_window: 131000
  context_margin_tokens: 512
  min_completion_tokens: 512

ffmpeg:
  # 视频转 GIF 下载所需；留空则前端不显示 GIF 下载按钮。
  # 本机路径请写在 config.local.yml 的 ffmpeg.path（该文件已被 .gitignore 忽略）。
  path: ""

video:
  duration:
    default: 5
    min: 5
    max: 15
  resolution_megapixels:
    default: 0.4
    min: 0.2
    max: 1.0

storage:
  task_data_dir: "video_data"
  workflow_dir: "video_workflows"
  access_data_dir: "access_data"
  retention_days: 90
  weekly_cleanup:
    weekday: 6
    hour: 3
  daily_disk_check:
    hour: 0
    minute: 5
  usage_threshold_percent: 90
