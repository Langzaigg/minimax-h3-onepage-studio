# Qwen → MiniMax H3 → 高清后处理工作台配置模板
# 用法：复制本文件为 config.yml 后按需修改（config.yml 已被 .gitignore 忽略，不会提交）。
# 所有配置（含 API Key、管理员密钥、本机 ffmpeg 路径等私有项）统一写入 config.yml。

server:
  host: 0.0.0.0
  port: 7788
  admin_key: "change-me"  # 生产环境务必修改，或通过 SERVICE_ADMIN_KEY 环境变量覆盖
  session_max_age_seconds: 31536000
  restart_delay_seconds: 1.5
  git_pull_timeout_seconds: 120

access:
  # admin（默认）= 管理员单用户模式：无需任何凭据，直接以管理员身份访问（全部历史可见）；
  # key = 密钥模式：管理员/API Key 访问；
  # register = 注册模式：任意用户名即可注册使用（无密码），各自历史隔离；输入管理员密钥自动以管理员身份登录
  mode: "admin"

comfyui:
  base_url: "http://127.0.0.1:8188"
  timeout_seconds: 60
  # 可选：ComfyUI 的 input 目录（本机磁盘路径）。配置后每次生成结束（成功或失败）
  # 会自动删除本次上传的临时图片/视频副本（minimax_h3_studio_* 前缀），
  # 避免 input 目录长期堆积垃圾文件。留空则不清理。
  # input_dir: "D:/ComfyUI_windows_portable/ComfyUI/input"
  models:
    fl2va_diffusion: "minimax_h3_fl2va_pruned_int8_convrot.safetensors"
    ref2va_diffusion: "minimax_h3_ref2va_pruned_int8_convrot.safetensors"
    # 综合标签页的两个独立档位，均支持首尾帧与多模态参考。
    # anime：Dasiwa Hybrid v2 非蒸馏版，默认完整 25 步。
    # nsfw：Eros beta5 已内置 Turbo，默认 8 步，不再叠加 Turbo LoRA。
    hybrid_diffusion: "DasiwaMinimaxH3_dasiwaHybridV2_int8.safetensors"
    hybrid_nsfw_diffusion: "ErosMax_H3_beta5_Turbo_INT8.safetensors"
    # 可选旧版动漫 Turbo 档；文件名留空即隐藏，仅 anime 可选。
    hybrid_turbo_diffusion: ""
    text_encoder: "qwen3vl_32b_minimax_h3_int8_convrot.safetensors"
    video_vae: "minimax_h3_video_vae_fp16.safetensors"
    audio_vae: "minimax_h3_audio_vae_fp32.safetensors"
  # 旧 FL2V / Ref2V 的 NSFW LoRA 配方已退役，保留空列表兼容历史配置。
  # 新的 NSFW 特调使用综合模式的 Eros Hybrid，不依赖这些 LoRA。
  # 空列表时隐藏旧下拉，接口传旧 nsfw=true 返回 400；普通模式及 Turbo 保留。
  nsfw:
    fl2v_presets: []
    ref2v_presets: []
  # 采样加速（Spectrum Apply MiniMax H3），默认不启用；启用需在 ComfyUI 安装对应自定义节点；
  # turbo 工作流和综合模式两个新档位均不使用该节点。
  spectrum_apply:
    enabled: false
  # Turbo 蒸馏 Lora（lightx2v）：fl2v 档位（文/首帧/尾帧/首尾帧共享）与 ref2v 档位（多模态参考）。
  # 步数直接写入 BasicScheduler.steps（配合 MiniMaxH3SigmaShift 生成对应步数的 sigma 网格，不做跳步）；
  # shift 为官方 video/audio 训练偏移（8step: 12,3；fl2v 4step 768p: 6,3；ref2v 4step: 12,3）。
  # 文件名留空（""）表示对应 turbo 档位禁用，前端不渲染对应分辨率选项。
  turbo:
    fl2v_8step_lora: ""
    fl2v_8step_shift: "12,3"
    fl2v_4step_lora: ""
    fl2v_4step_shift: "6,3"
    ref2v_4step_lora: ""
    ref2v_4step_shift: "12,3"
  # 综合模式采样参数（参考图保真优先，两个档位均不挂 Spectrum）：
  # 普通档（Non-Distilled）：推荐 res_multistep/simple 或 euler/simple，
  #   Shift Video 10-12、Shift Audio 3-5；默认完整 25 步。
  # 旧版动漫 turbo 加速（Distilled，前端可选开关）：固定 8 步直接采样，
  #   分辨率跟随用户所选档位。
  hybrid:
    steps: 25
    sampler: "res_multistep"
    scheduler: "simple"
    shift_video: 12
    shift_audio: 3
    turbo_steps: 8
    turbo_sampler: "euler"
    turbo_scheduler: "simple"
    turbo_shift_video: 12
    turbo_shift_audio: 3
    # Eros 作者建议 res_multistep/simple 6–9 步；8 步兼顾运动与速度。
    # 下列 shift 是本工作台沿用的 H3 起点，非作者发布的 beta5 专属定值。
    nsfw_steps: 8
    nsfw_sampler: "res_multistep"
    nsfw_scheduler: "simple"
    nsfw_shift_video: 12
    nsfw_shift_audio: 3

llm:
  base_url: "https://api.commandcode.ai/provider/v1"
  # 在未提交的 config.yml 中填写 api_keys；也可设置 LLM_API_KEY 环境变量。
  # api_keys 使用首个非空密钥；不要同时保留空的 api_key 字段。
  api_keys: []
  model: "moonshotai/Kimi-K2.7-Code"
  # 思考模式力度：low / medium / high；留空（""）则不发送 reasoning_effort，
  # 并回退为 chat_template_kwargs.enable_thinking=false（本地 vLLM 风格部署）。
  reasoning_effort: "low"
  timeout_seconds: 180
  max_output_tokens: 4096
  context_window: 131000
  context_margin_tokens: 512
  min_completion_tokens: 512
  # NSFW 破甲提示词开关：true 时润色系统提示词以拼接方式追加破甲与 NSFW 风格指南
  # （所有生成模式统一生效，含混合生成模式）。
  nsfw_armor: true

ffmpeg:
  # 参考视频转 480p GIF 喂给润色模型、参考视频压缩到输出分辨率、视频转 GIF 下载均依赖该路径；
  # 留空则这些功能自动降级（GIF 下载按钮不显示、润色回退为关键帧、参考视频原样上传）
  path: ""

video:
  duration: {default: 5, min: 5, max: 15}
  resolution_megapixels: {default: 0.4, min: 0.2, max: 1.0}

storage:
  retention_days: 90
  weekly_cleanup: {weekday: 6, hour: 3, minute: 0}
  daily_disk_check: {hour: 0, minute: 5}
  usage_threshold_percent: 90
